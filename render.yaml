# Render Blueprint - https://render.com/docs/blueprint-spec
# Creates the API web service on the free plan.
# Secrets marked `sync: false` must be filled in on the Render dashboard.
#
# Free-plan setup (see README "Free tier: keeping things awake"):
#  - An external cron (e.g. cron-job.org) pings GET /api/health every 10 min
#    so the free instance never sleeps. /api/health does NOT touch the
#    database, so Neon can still scale to zero and stay within its free hours.
#  - Optionally the same cron can POST /api/cron/meeting-links (with
#    CRON_SECRET); it is a no-op unless a meeting link is actually due.
services:
  - type: web
    name: ieee-enrollments-backend
    runtime: node
    plan: free
    region: singapore # same region as the Neon database (ap-southeast-1)
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ALLOWED_EMAIL_DOMAIN
        value: vitstudent.ac.in
      # Only the 2026 batch (emails ending in 2026@vitstudent.ac.in) can enroll.
      - key: ALLOWED_BATCH_YEARS
        value: "2026"
      - key: COOKIE_SAMESITE
        value: lax
      - key: ENABLE_INTERNAL_SCHEDULER
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: ACCESS_TOKEN_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SUPERADMIN_EMAILS
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: CLIENT_ORIGINS
        sync: false
      - key: APP_URL
        sync: false
      # Free Render blocks SMTP, so email goes through the Gmail API (HTTPS).
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CRON_SECRET
        generateValue: true
